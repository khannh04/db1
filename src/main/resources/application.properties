# =====================================================================
# CẤU HÌNH HỆ THỐNG QUẢN LÝ SINH VIÊN (QLSV)
# =====================================================================
server.port=8080

# Cấu hình kết nối MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/qlsv?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA
# Dùng update để tự động đồng bộ bảng hoặc tạo bảng nếu chưa có
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Cấu hình Jackson JSON Format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Ho_Chi_Minh
